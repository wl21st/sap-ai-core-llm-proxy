[project]
name = "sap-ai-core-llm-proxy"
version = "1.2.9"
description = "SAP AI Core Service Proxy Server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiobotocore>=3.9.2",
    "boto3>=1.43.106",
    "botocore>=1.43.106",
    "fastapi==0.143.5",
    "httpx>=0.28.1",
    "pydantic==2.14.1",
    "sap-ai-sdk-gen==7.4.1",
    "tenacity>=9.2.1",
    "requests==2.34.2",
    "uvicorn==0.54.0",
    "diskcache>=5.6.3",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.40.2",
    "black>=26.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
    "types-requests>=2.33.0.20261006",
]
build = [
    "pyinstaller>=6.22.3",
]

[project.scripts]
sap-ai-proxy = "main:main"
sap-ai-inspect = "inspect_deployments:main"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
    "types-requests>=2.33.0.20261006",
    "basedpyright>=1.40.2",
    "pyrefly>=1.4.0",
    "diskcache-stubs",
    "pyright>=1.1.414",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auth", "config", "utils", "handlers", "routers"]
py-modules = ["main", "proxy_server", "proxy_helpers", "version", "cli", "load_balancer", "inspect_deployments"]

[tool.ruff]
select = ["ANN"]  # ANN001 args, ANN201 returns, etc.
ignore = ["ANN101", "ANN102"]  # Skip stubs if needed
line-length = 88

[tool.pyrefly]
strict = false  # Tune to avoid slowdowns initially
skip-unannotated = false
show-inlay-hints = true
