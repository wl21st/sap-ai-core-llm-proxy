[project]
name = "sap-ai-core-llm-proxy"
version = "1.3.0"
description = "SAP AI Core Service Proxy Server"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aiobotocore>=3.9.0",
    "boto3>=1.43.0",
    "fastapi>=0.141.0,<0.142.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5,<3.0.0",
    "sap-ai-sdk-gen>=7.2.0",
    "tenacity>=9.1.4",
    "requests>=2.34.2",
    "uvicorn>=0.52.0,<0.53.0",
    "diskcache>=5.6.3",
    "filelock>=3.32.4",
]

[project.scripts]
saip = "saip.main:main"
sap-ai-proxy = "saip.main:main"
sap-ai-inspect = "saip.inspect_deployments:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10,<2.0.0",
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pyright>=1.1.411,<2.0.0",
    "ruff>=0.16.0,<0.17.0",
    "types-requests>=2.33.0",
    "pyrefly>=1.2.0",
    "diskcache-stubs",
]
build = [
    "hatchling>=1.26.0",
    "pyinstaller>=6.22.2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saip"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--color=yes",
    "--cov=src/saip",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(name)s - %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "unit: Unit tests for individual functions and classes",
    "integration: Integration tests for complete workflows",
    "slow: Tests that take longer to run",
    "requires_network: Tests that require network access",
    "requires_credentials: Tests that require valid SAP AI Core credentials",
    "real: Real integration tests against localhost proxy server",
    "smoke: Quick smoke tests for basic functionality",
    "streaming: Tests for streaming responses",
    "claude: Claude-specific tests",
    "openai: OpenAI-compatible tests",
    "gemini: Gemini-specific tests",
    "api: Direct API tests against SAP AI Core Bedrock",
    "bedrock: Tests that hit AWS Bedrock directly via SAP AI Core SDK",
]

[tool.coverage.run]
source = ["src/saip"]
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyrefly]
strict = false  # Tune to avoid slowdowns initially
skip-unannotated = false
show-inlay-hints = true
