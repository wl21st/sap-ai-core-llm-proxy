[project]
name = "sap-ai-core-llm-proxy"
version = "1.2.9"
description = "SAP AI Core Service Proxy Server"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aiobotocore>=2.24.0",
    "boto3>=1.34.0",
    "fastapi>=0.139.0,<0.140.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.4,<3.0.0",
    "sap-ai-sdk-gen>=6.10.0",
    "tenacity>=9.0.0",
    "requests>=2.34.2",
    "uvicorn>=0.51.0,<0.52.0",
    "diskcache>=5.6.3",
    "filelock>=3.30.2",
]

[project.scripts]
sap-ai-proxy = "main:main"
sap-ai-inspect = "inspect_deployments:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.7,<2.0.0",
    "black>=26.5.1",
    "mypy>=1.19.1",
    "pip-audit>=2.10.1",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pyright>=1.1.410,<2.0.0",
    "ruff>=0.15.17,<0.16.0",
    "types-requests>=2.33.0",
    "pyrefly>=0.46.1",
    "diskcache-stubs",
]
build = [
    "pyinstaller>=6.20.0",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auth", "config", "utils", "handlers", "routers"]
py-modules = ["main", "proxy_server", "proxy_helpers", "version", "load_balancer", "inspect_deployments"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ANN"]  # ANN001 args, ANN201 returns, etc.
ignore = ["ANN101", "ANN102"]  # Skip stubs if needed

[tool.pyrefly]
strict = false  # Tune to avoid slowdowns initially
skip-unannotated = false
show-inlay-hints = true
