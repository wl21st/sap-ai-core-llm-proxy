[project]
name = "sap-ai-core-llm-proxy"
version = "1.2.8"
description = "SAP AI Core Service Proxy Server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiobotocore>=2.13.0",
    "boto3>=1.43.0",
    "botocore>=1.43.0",
    "fastapi==0.136.3",
    "httpx>=0.27.0",
    "pydantic==2.13.4",
    "sap-ai-sdk-gen==6.10.0",
    "tenacity>=9.0.0",
    "requests==2.34.2",
    "uvicorn==0.49.0",
    "diskcache>=5.6.3",
    "filelock==3.29.3",
    "pip-audit==2.10.1",
    "ruff==0.15.17",
    "pyinstaller==6.20.0",
    "pyright==1.1.410",
    "basedpyright==1.39.7",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.39.6",
    "black>=26.5.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.15",
    "types-requests>=2.33.0.20260518",
]
build = [
    "pyinstaller>=6.16.0",
]

[project.scripts]
sap-ai-proxy = "main:main"
sap-ai-inspect = "inspect_deployments:main"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.10",
    "types-requests>=2.32.4.20250913",
    "basedpyright>=1.36.2",
    "pyrefly>=0.46.1",
    "diskcache-stubs",
    "pyright>=1.1.408",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auth", "config", "utils", "handlers", "routers"]
py-modules = ["main", "proxy_server", "proxy_helpers", "version", "cli", "load_balancer", "inspect_deployments"]

[tool.ruff]
select = ["ANN"]  # ANN001 args, ANN201 returns, etc.
ignore = ["ANN101", "ANN102"]  # Skip stubs if needed
line-length = 88

[tool.pyrefly]
strict = false  # Tune to avoid slowdowns initially
skip-unannotated = false
show-inlay-hints = true
